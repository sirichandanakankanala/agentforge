[pytest]
# Pytest configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    -ra

# Asyncio mode
asyncio_mode = auto
